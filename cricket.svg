<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cricket</title>
  <desc id="d">Top-down cricket field with a pitch, stumps, a bat and an animated ball. Text: Patience at the crease, consistency in code.</desc>
  <defs>
    <radialGradient id="grass" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#196c2e"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#b62324"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1038" height="298" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Field -->
  <ellipse cx="760" cy="150" rx="232" ry="122" fill="url(#grass)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <ellipse cx="760" cy="150" rx="140" ry="72" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Pitch -->
  <rect x="650" y="137" width="220" height="26" rx="3" fill="#c8a46a"/>
  <line x1="668" y1="133" x2="668" y2="167" stroke="#ffffff" stroke-width="2"/>
  <line x1="852" y1="133" x2="852" y2="167" stroke="#ffffff" stroke-width="2"/>
  <line x1="668" y1="137" x2="852" y2="137" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="668" y1="163" x2="852" y2="163" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Stumps -->
  <g fill="#f6e7c1">
    <rect x="658" y="143" width="6" height="14" rx="1.5"/>
    <rect x="856" y="143" width="6" height="14" rx="1.5"/>
  </g>

  <!-- Bat -->
  <g transform="translate(690 150) rotate(-28)">
    <rect x="-6" y="-8" width="12" height="40" rx="4" fill="#e0b070"/>
    <rect x="-2.5" y="-26" width="5" height="20" rx="2" fill="#6e4b2a"/>
  </g>

  <!-- Ball path + animated ball -->
  <path id="delivery" d="M850 150 Q765 112 676 150" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
  <g>
    <circle r="8" fill="url(#ball)"/>
    <path d="M-6 -3 Q0 0 -6 3" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M6 -3 Q0 0 6 3" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <animateMotion dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.6 1">
      <mpath href="#delivery"/>
    </animateMotion>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="112" font-size="38" font-weight="700" fill="#e6edf3">Cricket</text>
    <text x="40" y="144" font-size="15" fill="#8b949e">Patience at the crease. Consistency in code.</text>

    <rect x="40" y="170" width="96" height="28" rx="14" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="88" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">Discipline</text>
    <rect x="146" y="170" width="92" height="28" rx="14" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="192" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">Teamwork</text>
    <rect x="248" y="170" width="86" height="28" rx="14" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-opacity="0.5"/>
    <text x="291" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e">Strategy</text>

    <text x="40" y="262" font-size="13" fill="#8b949e">Hritik Kumar · @thisishritik</text>
  </g>
</svg>
