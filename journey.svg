<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="250" viewBox="0 0 1040 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Education and career journey</title>
  <desc id="d">Class 10 and Class 12 completed, BCA in progress, MCA and MBA planned, final goal: cybersecurity expert.</desc>
  <rect x="1" y="1" width="1038" height="248" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#e6edf3">My Journey</text>
    <text x="32" y="66" font-size="13" fill="#8b949e">From school to cybersecurity expert</text>

    <!-- track -->
    <line x1="90" y1="140" x2="430" y2="140" stroke="#3fb950" stroke-width="4" stroke-linecap="round"/>
    <line x1="430" y1="140" x2="940" y2="140" stroke="#484f58" stroke-width="3" stroke-dasharray="7 7"/>

    <!-- 1: Class 10 (done) -->
    <g transform="translate(90 140)">
      <circle r="16" fill="#3fb950"/>
      <path d="M-6 0 L-2 5 L7 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="90" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Class 10</text>
    <text x="90" y="184" text-anchor="middle" font-size="13" fill="#8b949e">BSEB · 2023</text>
    <rect x="40" y="198" width="100" height="22" rx="11" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="90" y="213" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#3fb950">COMPLETED</text>

    <!-- 2: Class 12 (done) -->
    <g transform="translate(260 140)">
      <circle r="16" fill="#3fb950"/>
      <path d="M-6 0 L-2 5 L7 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="260" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Class 12</text>
    <text x="260" y="184" text-anchor="middle" font-size="13" fill="#8b949e">BSEB · 2025</text>
    <rect x="210" y="198" width="100" height="22" rx="11" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="260" y="213" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#3fb950">COMPLETED</text>

    <!-- 3: BCA (in progress) -->
    <g transform="translate(430 140)">
      <circle r="16" fill="none" stroke="#58a6ff" stroke-width="2">
        <animate attributeName="r" values="16;32" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="#1f6feb" stroke="#58a6ff" stroke-width="3"/>
      <circle r="5" fill="#ffffff"/>
    </g>
    <text x="430" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">BCA</text>
    <text x="430" y="184" text-anchor="middle" font-size="13" fill="#8b949e">Online degree · Now</text>
    <rect x="375" y="198" width="110" height="22" rx="11" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="430" y="213" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#58a6ff">IN PROGRESS</text>

    <!-- 4: MCA (planned) -->
    <g transform="translate(600 140)">
      <circle r="16" fill="#0d1117" stroke="#a371f7" stroke-width="3"/>
      <circle r="4" fill="#a371f7"/>
    </g>
    <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">MCA</text>
    <text x="600" y="184" text-anchor="middle" font-size="13" fill="#8b949e">Master of Computer Apps</text>
    <rect x="550" y="198" width="100" height="22" rx="11" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7" stroke-opacity="0.5"/>
    <text x="600" y="213" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#a371f7">PLANNED</text>

    <!-- 5: MBA (planned) -->
    <g transform="translate(770 140)">
      <circle r="16" fill="#0d1117" stroke="#a371f7" stroke-width="3"/>
      <circle r="4" fill="#a371f7"/>
    </g>
    <text x="770" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">MBA</text>
    <text x="770" y="184" text-anchor="middle" font-size="13" fill="#8b949e">Management &amp; leadership</text>
    <rect x="720" y="198" width="100" height="22" rx="11" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7" stroke-opacity="0.5"/>
    <text x="770" y="213" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#a371f7">PLANNED</text>

    <!-- 6: Goal -->
    <g transform="translate(940 140)">
      <circle r="19" fill="#f0883e"/>
      <path d="M0 -10 L9 -6.5 V1 C9 6.5 4.5 10 0 12 C-4.5 10 -9 6.5 -9 1 V-6.5 Z" fill="#0d1117"/>
    </g>
    <text x="940" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Security Expert</text>
    <text x="940" y="184" text-anchor="middle" font-size="13" fill="#8b949e">The big goal</text>
    <rect x="900" y="198" width="80" height="22" rx="11" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-opacity="0.5"/>
    <text x="940" y="213" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#f0883e">GOAL</text>
  </g>
</svg>
