<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="290" viewBox="0 0 1040 290" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Diploma scores</title>
  <desc id="d">ADIT Grade A with 91 percent, ADCA Grade A with 84 percent, and the Kushal Yuva Program skill course.</desc>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8957e5"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1038" height="288" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#e6edf3">Diploma Scores</text>
    <text x="32" y="66" font-size="13" fill="#8b949e">Certified computer skills</text>

    <!-- ADIT 91% -->
    <text x="32" y="124" font-size="18" font-weight="700" fill="#e6edf3">ADIT</text>
    <text x="32" y="144" font-size="12" fill="#8b949e">Advanced Diploma in Information Technology</text>
    <rect x="420" y="112" width="500" height="20" rx="10" fill="#21262d"/>
    <rect x="420" y="112" width="455" height="20" rx="10" fill="url(#gBlue)">
      <animate attributeName="width" from="0" to="455" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="940" y="128" font-size="24" font-weight="700" fill="#e6edf3">91%</text>
    <text x="940" y="146" font-size="12" font-weight="700" fill="#3fb950">Grade A</text>

    <!-- ADCA 84% -->
    <text x="32" y="196" font-size="18" font-weight="700" fill="#e6edf3">ADCA</text>
    <text x="32" y="216" font-size="12" fill="#8b949e">Advanced Diploma in Computer Applications</text>
    <rect x="420" y="184" width="500" height="20" rx="10" fill="#21262d"/>
    <rect x="420" y="184" width="420" height="20" rx="10" fill="url(#gPurple)">
      <animate attributeName="width" from="0" to="420" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="940" y="200" font-size="24" font-weight="700" fill="#e6edf3">84%</text>
    <text x="940" y="218" font-size="12" font-weight="700" fill="#3fb950">Grade A</text>

    <!-- Kushal Yuva chip -->
    <rect x="32" y="244" width="400" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="52" cy="258" r="5" fill="#3fb950"/>
    <text x="68" y="263" font-size="13" fill="#e6edf3">Kushal Yuva Program (BSDM) · Skill development course</text>
  </g>
</svg>
